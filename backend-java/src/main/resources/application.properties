spring.application.name=FileUp


# MySql DB connection (build on docker-compose.yml)
spring.datasource.url=jdbc:mysql://localhost:3307/db_fileUp
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Private and public keys for JWT authentication
jwt.private-key=classpath:SecurityKeys/private.pem
jwt.public-key=classpath:SecurityKeys/public.pem


# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.flywaydb=DEBUG

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
