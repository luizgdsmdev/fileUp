name: FileUp
services:
  mysql:
    image: mysql
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: db_fileUp
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: admin

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
